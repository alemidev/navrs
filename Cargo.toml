[package]
name = "navrs"
version = "0.3.0"
edition = "2024"
authors = [ "alemi <me@alemi.dev>" ]
description = "navidrome rust client, music player in your terminal"
license = "GPL-3.0"
keywords = ["cli", "tui", "audio", "subsonic", "music"]
repository = "https://github.com/alemidev/navrs"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
dashmap = "6.2"
log = "0.4"
mpris-server = "0.10"
tokio = { version = "1.53", features = ["sync", "rt", "time", "macros"] }
rand = "0.10"
ratatui = "0.30"
thiserror = "2.0"
itertools = "0.15"
notify-rust = "4.18"
#submarine = "0.1"
submarine = { git = "https://github.com/alemidev/submarine", rev = "74b4c7b17c819272fbef5bbfc23594f139b3a699" }

serde = { version = "1.0", features = ["derive", "rc"] }
serde-inline-default = "1.0"
serde_default = "0.2"
toml = "1.1"
symphonia = { version = "0.6", features = ["all"] }
serde_json = "1.0.149"
ratatui-image = "11.1.0"
image = "0.25.10"

[features]
default = []
rounded = []
navidrome = ["submarine/navidrome"]
image = ["notify-rust/image"]


[profile.release]    # make small binaries! will take quite longer, from https://github.com/johnthagen/min-sized-rust
opt-level = 'z'      # optimize for size
lto = true           # enable Link Time Optimisation: don't link unused stuff
codegen-units = 1    # reducing codegen units slows it down but allows for better optimization
strip = "symbols"    # strip symbols from binary: have fun debugging on prod! :)
